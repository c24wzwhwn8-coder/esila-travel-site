function pLoadTesseract(){
  if(window.__tessLoad) return window.__tessLoad;
  window.__tessLoad=new Promise(function(res,rej){
    if(window.Tesseract){res(window.Tesseract);return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=function(){ window.Tesseract?res(window.Tesseract):rej(new Error('engine missing')); };
    s.onerror=function(){ rej(new Error('engine download failed')); };
    document.head.appendChild(s);
  });
  return window.__tessLoad;
}
function pTimeout(p,ms,msg){var t;return Promise.race([Promise.resolve(p).then(function(v){clearTimeout(t);return v;},function(e){clearTimeout(t);throw e;}),new Promise(function(_,rej){t=setTimeout(function(){rej(new Error(msg||'timeout'));},ms);})]);}

async function pTessWorker(){
  if(window.__tessW) return window.__tessW;

function pLoadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file);var i=new Image();i.onload=function(){res(i);setTimeout(function(){URL.revokeObjectURL(u);},1000);};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error('image load failed'));};i.src=u;});}
function pPrep(img,bandTop,bandBottom,targetW){
  var sy=Math.round(img.height*bandTop);var sh=Math.max(1,Math.round(img.height*(bandBottom-bandTop)));var sc=Math.min(1.8,targetW/img.width);
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(sh*sc));var ctx=c.getContext('2d');
  ctx.drawImage(img,0,sy,img.width,sh,0,0,c.width,c.height);
  try{var im=ctx.getImageData(0,0,c.width,c.height),d=im.data,i,g;for(i=0;i<d.length;i+=4){g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;}ctx.putImageData(im,0,0);}catch(e){}

  var img;try{img=await pLoadImg(file);}catch(e){return null;}
  var tries=[[0.68,1.0,1600],[0.50,1.0,1500],[0.0,1.0,1400]];
  try{for(var k=0;k<tries.length;k++){var url;try{url=pPrep(img,tries[k][0],tries[k][1],tries[k][2]);}catch(e){continue;}var txt='';try{txt=await pOcrText(url,onProg);}catch(e){return {err:(e&&e.message)||'error'};}var p=pParseMRZ(txt);if(p&&p.ok&&(p.passport||(p.surname&&p.surname.length>1)))return p;}return null;}finally{pTessFree();}
}

function pParseMRZ(text){
  var raw=(text||'').toUpperCase().split('\n').map(function(l){return l.replace(/[^A-Z0-9<]/g,'');}).filter(function(l){return l.length>=20;});
  var pad=function(s){return (s+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,44);};
  var l1=-1,i;for(i=0;i<raw.length;i++){if(/^P[A-Z<]/.test(raw[i])&&raw[i].indexOf('<')>0){l1=i;break;}}
  if(l1<0)return null;
  var line1=pad(raw[l1]);var line2='';for(i=l1+1;i<raw.length;i++){if(/[0-9]/.test(raw[i])){line2=pad(raw[i]);break;}}
  var nameField=line1.slice(5);var parts=nameField.split('<<');var surname=(parts[0]||'').replace(/</g,' ').trim();var given=(parts[1]||'').replace(/</g,' ').trim();
  var passport='';if(line2){passport=line2.slice(0,9).replace(/</g,'').trim();}
  var fullName=(given+' '+surname).replace(/\s+/g,' ').trim();
  return {fullName:fullName,surname:surname,given:given,passport:passport,ok:(surname.length>1||given.length>1)};
}

function removeItem(i){CART.splice(i,1);cartSave();renderCart();}
function cartPax(i,kind,delta){var it=CART[i];if(!it)return;if(kind=="a"){it.adults=Math.max(1,(it.adults||1)+delta);}else{it.children=Math.max(0,(it.children||0)+delta);}cartSave();renderCart();}
function paxCtl(lbl,i,kind,val){return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)">'+lbl+'<button onclick="cartPax('+i+',\''+kind+'\',-1)" style="width:24px;height:24px;border:1.5px solid var(--line);background:#fff;border-radius:7px;font-weight:800;cursor:pointer;font-family:inherit">−</button><b style="min-width:14px;text-align:center;color:var(--ink)">'+val+'</b><button onclick="cartPax('+i+',\''+kind+'\',1)" style="width:24px;height:24px;border:1.5px solid var(--line);background:#fff;border-radius:7px;font-weight:800;cursor:pointer;font-family:inherit">+</button></span>';}
function renderCart(){var L=lang=="tr";var tt=document.getElementById('cartTitle');if(tt)tt.textContent=L?"Sepet":"Cart";var body=document.getElementById('cartBody'),foot=document.getElementById('cartFoot');if(!body)return;
  if(!CART.length){body.innerHTML='<div style="text-align:center;color:var(--muted);padding:44px 10px">'+(L?"Sepetiniz boş.":"Your cart is empty.")+'</div>';foot.innerHTML='';return;}
  body.innerHTML=CART.map(function(it,i){var c=itCalc(it);if(!c)return '';var p=c.p;var pk=(it.pkg!=null&&it.pkg>=0&&p.pkgs&&p.pkgs[it.pkg])?(' · '+p.pkgs[it.pkg][lang]):'';
    var paxHtml=c.pv?'':'<div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap">'+paxCtl(L?"Yetişkin":"Adult",i,'a',it.adults||1)+paxCtl(L?"Çocuk":"Child",i,'c',it.children||0)+'</div>';
    return '<div class="cart-item"><div style="flex:1;min-width:0">'+
      '<div class="cart-nm">'+p.name[lang]+pk+'</div>'+
      '<div class="cart-sub">'+it.date+' · '+(c.pay=="deposit"?(L?"%50 kapora":"50% deposit"):(L?"tam ödeme":"full payment"))+'</div>'+
      paxHtml+
      '</div><div style="text-align:right"><div class="cart-amt">'+money(c.tot)+'</div><button class="cart-rm" onclick="removeItem('+i+')">'+(L?"Kaldır":"Remove")+'</button></div></div>';
  }).join('');
  var grand=0,now=0;CART.forEach(function(it){var c=itCalc(it);if(!c)return;grand+=c.tot;now+=(c.pay=="deposit"?c.tot*0.5:c.tot);});
  foot.innerHTML='<div class="cart-row"><span>'+(L?"Toplam":"Total")+' ('+CART.length+')</span><b>'+money(grand)+'</b></div>'+
    '<div class="cart-row" style="color:var(--muted)"><span>'+(L?"Şimdi ödenecek":"Pay now")+'</span><span>'+money(now)+'</span></div>'+
    '<button class="cart-co" onclick="checkout()">'+(L?"Siparişi Tamamla":"Checkout")+' → '+money(now)+'</button>'+
    '<button class="cart-keep" onclick="closeCart()">'+(L?"Alışverişe devam et":"Keep shopping")+'</button>';
}
function checkout(){if(!CART.length)return;var L=lang=="tr";var lines=[],grand=0,now=0;
  CART.forEach(function(it){var c=itCalc(it);if(!c)return;var p=c.p;var pk=(it.pkg!=null&&it.pkg>=0&&p.pkgs&&p.pkgs[it.pkg])?(' - '+p.pkgs[it.pkg][lang]):'';grand+=c.tot;now+=(c.pay=="deposit"?c.tot*0.5:c.tot);
    var who=c.pv?'':(' | '+(it.adults||1)+(L?" yetişkin":" adult")+', '+(it.children||0)+(L?" çocuk":" child"));
    lines.push('• '+p.name[lang]+pk+' | '+it.date+who+' | '+money(c.tot)+(c.pay=="deposit"?(L?" (%50 kapora)":" (50% deposit)"):""));});
  var msg=(L?"Merhaba, aşağıdaki siparişi vermek istiyorum:":"Hello, I would like to place the following order:")+"\n\n"+lines.join("\n")+"\n\n"+(L?"Toplam":"Total")+": "+money(grand)+"\n"+(L?"Şimdi ödenecek":"Pay now")+": "+money(now);
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}
function toggleMenu(){var n=document.getElementById('navLinks');if(n)n.classList.toggle('open');}
function go(route,anchor){var n=document.getElementById('navLinks');if(n)n.classList.remove('open');location.hash=route?('#/'+route):'#/'; scrollTarget=anchor||null; if(route===''&&!anchor)window.scrollTo(0,0);}
function render(){
  var h=location.hash.replace(/^#\//,'');
  var app=document.getElementById('app');
  if(h.indexOf('p/')===0){app.innerHTML=viewDetail(h.slice(2));initDetail();}
  else if(h=='turlar'){app.innerHTML=viewList(); if(window.__pre){var qi=document.getElementById('q'),ci=document.getElementById('qcity'); if(qi)qi.value=window.__pre.q||''; if(ci)ci.value=window.__pre.city||''; applyFilter(); window.__pre=null;}}
  else if(h=='vize'){app.innerHTML=viewVisa(); initVisa(); window.scrollTo(0,0);}
  else if(h=='hakkimizda'){app.innerHTML=viewAbout(); window.scrollTo(0,0);}
  else if(h=='iletisim'){app.innerHTML=viewContact(); window.scrollTo(0,0);}
  else if(h=='teklif'){app.innerHTML=viewQuote(); qRender(1); window.scrollTo(0,0);}
  else if(h=='sartlar'){app.innerHTML=viewTerms(); window.scrollTo(0,0);}
  else if(h=='gizlilik'){app.innerHTML=viewPrivacy(); window.scrollTo(0,0);}
  else {app.innerHTML=viewHome();}
  renderChrome();
  document.documentElement.lang=lang;
  if(scrollTarget){var el=document.getElementById(scrollTarget); if(el)el.scrollIntoView({behavior:'smooth'}); scrollTarget=null;}
  else if(h.indexOf('p/')===0)window.scrollTo(0,0);
}
function setLang(v){lang=v; render();}
function setCur(v){cur=v; render();}
window.addEventListener('hashchange',render);

function mapRow(r){return {slug:r.slug,type:r.ptype,city:r.city,grad:r.grad,photo:r.photo_url||null,child:(r.child_price!=null?r.child_price:null),age:r.age_info||null,

function loadFX(){
  try{
    fetch("https://open.er-api.com/v6/latest/AED")
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){ if(j&&j.rates){ if(j.rates.TRY)RATE.TRY=j.rates.TRY; if(j.rates.USD)RATE.USD=j.rates.USD; render(); } })
      .catch(function(){});
  }catch(e){}
}
function bootstrap(){
  loadFX();
  try{
    fetch(SB_URL+"/rest/v1/esila_products?select=*&active=eq.true&order=sort",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(rows){ if(rows&&rows.length){ DATA=rows.map(mapRow); } render(); })
      .catch(function(){ render(); });
  }catch(e){ render(); }
}
